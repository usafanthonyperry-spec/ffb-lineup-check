<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Fantasy Lineup Check</title>
<style>
:root{--bg:#0f1113;--card:#1a1d20;--border:#343a40;--text:#f5f5f5;--muted:#a7adb4;--yellow:#f2c94c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
.card{max-width:520px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px}
h2{margin:0 0 10px;font-size:24px}
p{color:var(--muted);line-height:1.45;margin:8px 0}
.update{color:var(--yellow);font-weight:800;font-size:21px;line-height:1.35}
</style>
</head>
<body>
<div class="card">
  <h2>🏈 Fantasy Lineup Check</h2>
  <div id="status"><p>Checking for updates…</p></div>
</div>
<script>
(async () => {
  const status = document.getElementById("status");
  const STORAGE_KEY = "ffb-last-announced-release-v2";
  const dashboard = "https://www.thefantasyfootballers.com/footclan/ultimate-dashboard/";

  const go = (delay) => setTimeout(() => location.replace(dashboard), delay);

  try {
    const response = await fetch("./version.json?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!response.ok) throw new Error("version request failed");

    const info = await response.json();
    const latest = String(info.version || "").trim();
    let last = "";
    try { last = localStorage.getItem(STORAGE_KEY) || ""; } catch (_) {}

    if (latest && latest !== last) {
      status.innerHTML =
        '<div class="update">⬆️ New version available — v' + latest + '</div>' +
        '<p>Compare this with the version shown at the top of your lineup-checker results.</p>' +
        '<p>Opening the Dashboard…</p>';
      try { localStorage.setItem(STORAGE_KEY, latest); } catch (_) {}
      go(4500);
      return;
    }

    status.innerHTML = "<p>Opening the Ultimate Dashboard…</p>";
    go(350);
  } catch (_) {
    status.innerHTML = "<p>Opening the Ultimate Dashboard…</p>";
    go(350);
  }
})();
</script>
</body>
</html>
